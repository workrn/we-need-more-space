<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Need More Space 🪐 | Personal Link Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Quicksand"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root[data-theme="linen"] {
      --bg-main: #fbf9f5;
      --bg-card: #fdfcf9;
      --bg-subtle: #f3efe6;
      --border-subtle: #e6dfd3;
      --text-main: #2d3137;
      --text-muted: #6b7280;
      --accent: #5e7153;
      --accent-subtle: #edf3e8;
      --badge-bg: #efece4;
    }
    :root[data-theme="sage"] {
      --bg-main: #f4f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #e5ece5;
      --border-subtle: #d2ddd2;
      --text-main: #273428;
      --text-muted: #5e6f60;
      --accent: #48694c;
      --accent-subtle: #e3ede3;
      --badge-bg: #e6eee6;
    }
    :root[data-theme="lavender"] {
      --bg-main: #f7f6f9;
      --bg-card: #ffffff;
      --bg-subtle: #ece8f2;
      --border-subtle: #ded8e8;
      --text-main: #2e2a36;
      --text-muted: #6b6377;
      --accent: #6c5a8a;
      --accent-subtle: #f0ebf8;
      --badge-bg: #eeeaf5;
    }
    :root[data-theme="latte"] {
      --bg-main: #f9f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #ede6dc;
      --border-subtle: #dfd4c5;
      --text-main: #383028;
      --text-muted: #74685a;
      --accent: #7c6246;
      --accent-subtle: #f5ece2;
      --badge-bg: #efe9e0;
    }
    :root[data-theme="dark"] {
      --bg-main: #181b1e;
      --bg-card: #22262b;
      --bg-subtle: #2d333b;
      --border-subtle: #3a414b;
      --text-main: #e8ecf1;
      --text-muted: #9aa2ad;
      --accent: #86a77d;
      --accent-subtle: #273525;
      --badge-bg: #2d333a;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-subtle);
    }
    .theme-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-subtle);
    }
    .theme-accent-btn {
      background-color: var(--accent);
      color: #ffffff;
    }
    .theme-accent-btn:hover {
      filter: brightness(0.92);
    }
    .theme-badge {
      background-color: var(--badge-bg);
      color: var(--text-muted);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-opacity-90 border-b theme-card">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center text-base shadow-xs border border-stone-200/50" style="background-color: var(--accent-subtle);">
          🪐
        </div>
        <div>
          <h1 class="font-display font-bold text-sm sm:text-base tracking-tight leading-tight">
            We Need More Space
          </h1>
          <p class="text-[10px] text-stone-500 leading-none">cozy corner for your links 🍃</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative">
          <select id="themeSelector" class="text-xs font-medium rounded-xl px-2.5 py-1.5 border appearance-none pr-7 cursor-pointer theme-subtle focus:outline-none">
            <option value="linen">🌾 Linen</option>
            <option value="sage">🍃 Sage</option>
            <option value="lavender">🌸 Lavender</option>
            <option value="latte">☕ Latte</option>
            <option value="dark">🌌 Midnight</option>
          </select>
          <i data-lucide="palette" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-60"></i>
        </div>

        <div id="authContainer" class="flex items-center">
          <button id="btnLogin" class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1.5 rounded-xl border border-stone-300 shadow-xs hover:bg-stone-50 transition-colors bg-white text-stone-800">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="hidden sm:inline">Masuk</span>
          </button>

          <div id="userProfile" class="hidden items-center gap-2">
            <img id="userAvatar" src="" alt="Avatar" class="w-7 h-7 rounded-full border border-stone-200 object-cover">
            <button id="btnLogout" title="Keluar Akun" class="p-1.5 rounded-xl border theme-subtle hover:text-red-500 transition-colors">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 py-4 space-y-3.5">

    <!-- Status Bar -->
    <div id="syncBanner" class="py-1.5 px-3 rounded-xl border text-xs flex items-center justify-between gap-2 theme-card">
      <div class="flex items-center gap-2">
        <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
        <span id="syncText" class="text-stone-600 dark:text-stone-300">Penyimpanan: Browser Lokal</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btnExport" class="text-[11px] px-2 py-0.5 rounded-md border theme-subtle hover:opacity-80">Backup</button>
        <button id="btnImport" class="text-[11px] px-2 py-0.5 rounded-md border theme-subtle hover:opacity-80">Restore</button>
        <input type="file" id="fileImportInput" accept=".json" class="hidden">
      </div>
    </div>

    <!-- Toolbar -->
    <div class="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
        <input type="text" id="searchInput" placeholder="Cari judul, tag, link..." class="w-full text-xs pl-8 pr-3 py-2 rounded-xl border theme-card focus:outline-none">
      </div>

      <div class="flex items-center gap-1.5 flex-wrap">
        <select id="categoryFilter" class="text-xs py-2 px-2.5 rounded-xl border theme-card focus:outline-none cursor-pointer">
          <option value="ALL">Semua 📂</option>
          <option value="Kerja">💼 Kerja</option>
          <option value="Belajar">📚 Belajar</option>
          <option value="Bacaan">📖 Bacaan</option>
          <option value="Belanja">🛍️ Belanja</option>
          <option value="Inspirasi">✨ Ide</option>
          <option value="Lainnya">📎 Lainnya</option>
        </select>

        <button id="filterFavBtn" title="Hanya Favorit" class="p-2 text-xs rounded-xl border theme-card hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
          <i data-lucide="star" class="w-4 h-4 text-amber-500"></i>
        </button>

        <div class="flex items-center rounded-xl border theme-card p-0.5">
          <button id="viewGridBtn" title="Tampilan Kotak (Grid)" class="p-1.5 rounded-lg transition-colors bg-stone-200/70 dark:bg-stone-700 text-stone-800 dark:text-stone-100">
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          </button>
          <button id="viewListBtn" title="Tampilan Baris (List)" class="p-1.5 rounded-lg transition-colors text-stone-400 hover:text-stone-700">
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <button id="btnOpenModal" class="flex items-center gap-1 text-xs font-semibold px-3 py-2 rounded-xl shadow-xs theme-accent-btn transition-transform active:scale-95 ml-auto sm:ml-0">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Simpan Link</span>
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-10 px-4">
      <div class="w-12 h-12 mx-auto mb-2 rounded-2xl flex items-center justify-center text-2xl theme-subtle">
        📭
      </div>
      <h3 class="font-display font-bold text-sm text-stone-700 dark:text-stone-200">Belum ada link di sini</h3>
      <p class="text-[11px] text-stone-500 mt-0.5">Klik tombol <strong>"Simpan Link"</strong> untuk menaruh link favoritmu!</p>
    </div>

    <!-- Links Grid / List Container -->
    <div id="linksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
    </div>

  </main>

  <!-- Modal Form -->
  <div id="linkModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl p-5 theme-card border shadow-xl relative animate-in fade-in zoom-in-95 duration-150">
      
      <div class="flex items-center justify-between pb-2.5 border-b border-stone-200/60 dark:border-stone-700">
        <h3 id="modalTitle" class="font-display font-bold text-sm flex items-center gap-1.5">
          <span>✨</span> Simpan Link Baru
        </h3>
        <button id="btnCloseModal" class="p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <form id="linkForm" class="mt-3 space-y-2.5 text-xs">
        <input type="hidden" id="editLinkId">

        <div>
          <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">URL Website <span class="text-red-500">*</span></label>
          <input type="url" id="inputUrl" required placeholder="https://example.com" class="w-full px-3 py-1.5 rounded-lg border theme-subtle focus:outline-none">
        </div>

        <div>
          <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Judul / Nama <span class="text-red-500">*</span></label>
          <input type="text" id="inputTitle" required placeholder="Nama website / catatan" class="w-full px-3 py-1.5 rounded-lg border theme-subtle focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Kategori</label>
            <select id="inputCategory" class="w-full px-2 py-1.5 rounded-lg border theme-subtle focus:outline-none cursor-pointer">
              <option value="Kerja">💼 Kerja</option>
              <option value="Belajar">📚 Belajar</option>
              <option value="Bacaan">📖 Bacaan</option>
              <option value="Belanja">🛍️ Belanja</option>
              <option value="Inspirasi">✨ Ide</option>
              <option value="Lainnya">📎 Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Favorit?</label>
            <div class="flex items-center h-8">
              <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="inputFavorite" class="w-3.5 h-3.5 rounded text-amber-500 focus:ring-0">
                <span class="text-[11px]">Bintang ⭐</span>
              </label>
            </div>
          </div>
        </div>

        <div>
          <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Catatan Singkat (Opsional)</label>
          <textarea id="inputNotes" rows="2" placeholder="Catatan kecil..." class="w-full px-3 py-1.5 rounded-lg border theme-subtle focus:outline-none resize-none"></textarea>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" id="btnCancelModal" class="flex-1 py-2 rounded-xl border theme-subtle font-medium">Batal</button>
          <button type="submit" class="flex-1 py-2 rounded-xl font-medium shadow-xs theme-accent-btn">Simpan</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-16 opacity-0 transition-all duration-200 pointer-events-none px-3 py-2 rounded-xl theme-card border shadow-md text-xs font-medium flex items-center gap-1.5">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Berhasil!</span>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDXzDZAijlJ47lxU1hYgYU-x_Bhsd5Bbg",
      authDomain: "we-need-space.firebaseapp.com",
      projectId: "we-need-space",
      storageBucket: "we-need-space.firebasestorage.app",
      messagingSenderId: "645398768628",
      appId: "1:645398768628:web:080b1dc382411f8ca2a7a1"
    };

    let app, auth, db, provider;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      provider = new GoogleAuthProvider();
    } catch(e) {
      console.warn("Firebase initialization warning:", e);
    }

    // Default Starter Links jika data masih kosong
    const starterLinks = [
      {
        id: "starter_1",
        title: "Google Drive & Dokumen",
        url: "https://drive.google.com",
        category: "Kerja",
        favorite: true,
        notes: "Akses cepat ke berkas, form, dan materi kerja.",
        createdAt: Date.now()
      },
      {
        id: "starter_2",
        title: "Universitas Terbuka (SIA UT)",
        url: "https://admisi-sia.ut.ac.id",
        category: "Belajar",
        favorite: true,
        notes: "Portal akademik untuk kuliah dan materi ujian.",
        createdAt: Date.now() - 1000
      },
      {
        id: "starter_3",
        title: "Pinterest - Aesthetic & Ideas",
        url: "https://pinterest.com",
        category: "Inspirasi",
        favorite: false,
        notes: "Cari moodboard, referensi desain, dan hal santai.",
        createdAt: Date.now() - 2000
      }
    ];

    let currentUser = null;
    let links = [];
    let filterCategory = 'ALL';
    let filterFavoriteOnly = false;
    let searchQuery = '';
    let currentView = localStorage.getItem('wnms_view') || 'grid';

    const linksGrid = document.getElementById('linksGrid');
    const emptyState = document.getElementById('emptyState');
    const themeSelector = document.getElementById('themeSelector');
    const linkModal = document.getElementById('linkModal');
    const linkForm = document.getElementById('linkForm');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const filterFavBtn = document.getElementById('filterFavBtn');
    const viewGridBtn = document.getElementById('viewGridBtn');
    const viewListBtn = document.getElementById('viewListBtn');
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const userProfile = document.getElementById('userProfile');
    const userAvatar = document.getElementById('userAvatar');

    const categoryConfig = {
      Kerja: { emoji: '💼', label: 'Kerja' },
      Belajar: { emoji: '📚', label: 'Belajar' },
      Bacaan: { emoji: '📖', label: 'Bacaan' },
      Belanja: { emoji: '🛍️', label: 'Belanja' },
      Inspirasi: { emoji: '✨', label: 'Ide' },
      Lainnya: { emoji: '📎', label: 'Lainnya' }
    };

    function initTheme() {
      const savedTheme = localStorage.getItem('wnms_theme') || 'linen';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeSelector.value = savedTheme;
    }

    themeSelector.addEventListener('change', (e) => {
      const chosen = e.target.value;
      document.documentElement.setAttribute('data-theme', chosen);
      localStorage.setItem('wnms_theme', chosen);
    });

    function setViewMode(mode) {
      currentView = mode;
      localStorage.setItem('wnms_view', mode);

      if (mode === 'list') {
        linksGrid.className = 'flex flex-col gap-1.5';
        viewListBtn.className = 'p-1.5 rounded-lg transition-colors bg-stone-200/70 dark:bg-stone-700 text-stone-800 dark:text-stone-100';
        viewGridBtn.className = 'p-1.5 rounded-lg transition-colors text-stone-400 hover:text-stone-700';
      } else {
        linksGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5';
        viewGridBtn.className = 'p-1.5 rounded-lg transition-colors bg-stone-200/70 dark:bg-stone-700 text-stone-800 dark:text-stone-100';
        viewListBtn.className = 'p-1.5 rounded-lg transition-colors text-stone-400 hover:text-stone-700';
      }
      renderLinks();
    }

    viewGridBtn.addEventListener('click', () => setViewMode('grid'));
    viewListBtn.addEventListener('click', () => setViewMode('list'));

    function loadLocalLinks() {
      try {
        const raw = localStorage.getItem('wnms_links');
        if (!raw) {
          localStorage.setItem('wnms_links', JSON.stringify(starterLinks));
          return starterLinks;
        }
        return JSON.parse(raw);
      } catch (e) {
        return starterLinks;
      }
    }

    function saveLocalLinks(data) {
      localStorage.setItem('wnms_links', JSON.stringify(data));
    }

    async function syncToCloud() {
      if (!currentUser || !db) {
        saveLocalLinks(links);
        return;
      }
      try {
        const docRef = doc(db, 'users', currentUser.uid);
        await setDoc(docRef, { links: links, updatedAt: new Date().toISOString() }, { merge: true });
        showToast('Tersimpan di Cloud ☁️');
      } catch (err) {
        console.error('Error cloud sync:', err);
        saveLocalLinks(links);
      }
    }

    async function fetchFromCloud(uid) {
      try {
        const docRef = doc(db, 'users', uid);
        const snap = await getDoc(docRef);
        if (snap.exists() && snap.data().links && snap.data().links.length > 0) {
          links = snap.data().links;
        } else {
          links = loadLocalLinks();
          await syncToCloud();
        }
      } catch (err) {
        console.error('Fetch cloud fallback:', err);
        links = loadLocalLinks();
      }
      renderLinks();
    }

    if (btnLogin && auth) {
      btnLogin.addEventListener('click', async () => {
        try {
          await signInWithPopup(auth, provider);
        } catch (e) {
          alert('Login info: ' + e.message);
        }
      });
    }

    if (btnLogout && auth) {
      btnLogout.addEventListener('click', async () => {
        await signOut(auth);
        showToast('Berhasil keluar');
      });
    }

    if (auth) {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          btnLogin.classList.add('hidden');
          userProfile.classList.remove('hidden');
          userAvatar.src = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;
          
          syncDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
          syncText.innerText = `Cloud: ${user.displayName || user.email}`;
          
          await fetchFromCloud(user.uid);
        } else {
          currentUser = null;
          btnLogin.classList.remove('hidden');
          userProfile.classList.add('hidden');
          
          syncDot.className = 'w-2 h-2 rounded-full bg-amber-400';
          syncText.innerText = 'Penyimpanan: Browser Lokal';
          
          links = loadLocalLinks();
          renderLinks();
        }
      });
    } else {
      links = loadLocalLinks();
      renderLinks();
    }

    function renderLinks() {
      linksGrid.innerHTML = '';
      
      const filtered = links.filter(item => {
        const matchesCategory = (filterCategory === 'ALL' || item.category === filterCategory);
        const matchesFavorite = (!filterFavoriteOnly || item.favorite);
        const query = searchQuery.toLowerCase();
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              item.url.toLowerCase().includes(query) || 
                              (item.notes && item.notes.toLowerCase().includes(query));
        return matchesCategory && matchesFavorite && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        
        filtered.forEach(item => {
          let hostname = '';
          try {
            hostname = new URL(item.url).hostname.replace('www.', '');
          } catch(e) {
            hostname = item.url;
          }

          const card = document.createElement('div');

          if (currentView === 'list') {
            card.className = 'theme-card border rounded-xl px-3 py-2 flex items-center justify-between gap-3 hover:shadow-xs transition-all group';
            card.innerHTML = `
              <div class="flex items-center gap-2.5 min-w-0 flex-1">
                <img src="https://www.google.com/s2/favicons?domain=${hostname}&sz=32" 
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'" 
                     class="w-4 h-4 rounded p-0.5 border border-stone-200/80 bg-white object-contain flex-shrink-0" alt="Favicon">
                
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2">
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-display font-bold text-xs hover:underline truncate hover:text-emerald-700 dark:hover:text-emerald-400">
                      ${escapeHtml(item.title)}
                    </a>
                    <span class="text-[10px] font-medium px-1.5 py-0.2 rounded-md theme-badge flex-shrink-0">
                      ${categoryConfig[item.category]?.emoji || '📎'} ${item.category}
                    </span>
                  </div>
                  ${item.notes ? `<p class="text-[11px] text-stone-500 dark:text-stone-400 truncate">${escapeHtml(item.notes)}</p>` : ''}
                </div>
              </div>

              <div class="flex items-center gap-1 flex-shrink-0">
                <button class="toggle-fav-btn p-1 text-stone-400 hover:text-amber-500" data-id="${item.id}" title="Favorit">
                  <i data-lucide="star" class="w-3.5 h-3.5 ${item.favorite ? 'fill-amber-400 text-amber-500' : ''}"></i>
                </button>
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="p-1 text-stone-500 hover:text-stone-800" title="Buka">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </a>
                <button class="copy-btn p-1 text-stone-400 hover:text-stone-700" data-url="${item.url}" title="Salin URL">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                </button>
                <button class="edit-btn p-1 text-stone-400 hover:text-stone-700" data-id="${item.id}" title="Edit">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                </button>
                <button class="delete-btn p-1 text-stone-400 hover:text-red-500" data-id="${item.id}" title="Hapus">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `;
          } else {
            card.className = 'theme-card border rounded-2xl p-3 flex flex-col justify-between hover:shadow-sm transition-all duration-150 group';
            card.innerHTML = `
              <div>
                <div class="flex items-start justify-between gap-2 mb-1.5">
                  <div class="flex items-center gap-2 min-w-0">
                    <img src="https://www.google.com/s2/favicons?domain=${hostname}&sz=32" 
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'" 
                         class="w-5 h-5 rounded-md p-0.5 border border-stone-200/80 bg-white object-contain flex-shrink-0" alt="Favicon">
                    <h4 class="font-display font-bold text-xs sm:text-sm leading-tight truncate">${escapeHtml(item.title)}</h4>
                  </div>
                  <button class="toggle-fav-btn p-0.5 text-stone-400 hover:text-amber-500 transition-colors flex-shrink-0" data-id="${item.id}">
                    <i data-lucide="star" class="w-3.5 h-3.5 ${item.favorite ? 'fill-amber-400 text-amber-500' : ''}"></i>
                  </button>
                </div>

                ${item.notes ? `<p class="text-[11px] text-stone-500 dark:text-stone-400 line-clamp-2 mb-2 leading-relaxed">${escapeHtml(item.notes)}</p>` : ''}
                
                <div class="flex items-center gap-1.5 mb-2.5">
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full theme-badge flex items-center gap-0.5">
                    ${categoryConfig[item.category]?.emoji || '📎'} ${item.category}
                  </span>
                  <span class="text-[10px] text-stone-400 truncate max-w-[120px]">${hostname}</span>
                </div>
              </div>

              <div class="pt-2 border-t border-stone-100 dark:border-stone-800/80 flex items-center justify-between text-xs">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-semibold text-[11px] flex items-center gap-1 hover:underline" style="color: var(--accent);">
                  Buka <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>

                <div class="flex items-center gap-0.5">
                  <button class="copy-btn p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-400 hover:text-stone-600" data-url="${item.url}" title="Salin">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  </button>
                  <button class="edit-btn p-1 rounded-md hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-400 hover:text-stone-600" data-id="${item.id}" title="Edit">
                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                  </button>
                  <button class="delete-btn p-1 rounded-md hover:bg-red-50 hover:text-red-600 text-stone-400" data-id="${item.id}" title="Hapus">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            `;
          }

          linksGrid.appendChild(card);
        });
      }

      if (window.lucide) {
        lucide.createIcons();
      }
      attachCardListeners();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    const btnOpenModal = document.getElementById('btnOpenModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnCancelModal = document.getElementById('btnCancelModal');
    const modalTitle = document.getElementById('modalTitle');
    const editLinkId = document.getElementById('editLinkId');

    function openModal(editItem = null) {
      if (editItem) {
        modalTitle.innerHTML = '<span>✏️</span> Edit Tautan';
        editLinkId.value = editItem.id;
        document.getElementById('inputUrl').value = editItem.url;
        document.getElementById('inputTitle').value = editItem.title;
        document.getElementById('inputCategory').value = editItem.category || 'Lainnya';
        document.getElementById('inputFavorite').checked = !!editItem.favorite;
        document.getElementById('inputNotes').value = editItem.notes || '';
      } else {
        modalTitle.innerHTML = '<span>✨</span> Simpan Link Baru';
        editLinkId.value = '';
        linkForm.reset();
      }
      linkModal.classList.remove('hidden');
      linkModal.classList.add('flex');
    }

    function closeModal() {
      linkModal.classList.add('hidden');
      linkModal.classList.remove('flex');
      linkForm.reset();
    }

    btnOpenModal.addEventListener('click', () => openModal());
    btnCloseModal.addEventListener('click', closeModal);
    btnCancelModal.addEventListener('click', closeModal);

    linkForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = editLinkId.value;
      const url = document.getElementById('inputUrl').value.trim();
      const title = document.getElementById('inputTitle').value.trim();
      const category = document.getElementById('inputCategory').value;
      const favorite = document.getElementById('inputFavorite').checked;
      const notes = document.getElementById('inputNotes').value.trim();

      if (id) {
        const index = links.findIndex(l => l.id === id);
        if (index !== -1) {
          links[index] = { ...links[index], url, title, category, favorite, notes, updatedAt: Date.now() };
          showToast('Tautan diperbarui! ✏️');
        }
      } else {
        const newItem = {
          id: 'link_' + Date.now(),
          url,
          title,
          category,
          favorite,
          notes,
          createdAt: Date.now()
        };
        links.unshift(newItem);
        showToast('Link baru tersimpan! 🪐');
      }

      closeModal();
      renderLinks();
      await syncToCloud();
    });

    function attachCardListeners() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const url = btn.getAttribute('data-url');
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(() => showToast('Disalin! 📋'));
          } else {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Disalin! 📋');
          }
        });
      });

      document.querySelectorAll('.toggle-fav-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const target = links.find(l => l.id === id);
          if (target) {
            target.favorite = !target.favorite;
            renderLinks();
            await syncToCloud();
          }
        });
      });

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const target = links.find(l => l.id === id);
          if (target) openModal(target);
        });
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (confirm('Hapus link ini?')) {
            links = links.filter(l => l.id !== id);
            renderLinks();
            await syncToCloud();
            showToast('Dihapus 🗑️');
          }
        });
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderLinks();
    });

    categoryFilter.addEventListener('change', (e) => {
      filterCategory = e.target.value;
      renderLinks();
    });

    filterFavBtn.addEventListener('click', () => {
      filterFavoriteOnly = !filterFavoriteOnly;
      if (filterFavoriteOnly) {
        filterFavBtn.classList.add('bg-amber-100', 'border-amber-300', 'dark:bg-amber-950/40');
      } else {
        filterFavBtn.classList.remove('bg-amber-100', 'border-amber-300', 'dark:bg-amber-950/40');
      }
      renderLinks();
    });

    document.getElementById('btnExport').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(links, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `we-need-more-space-${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Cadangan diunduh 📦');
    });

    const fileImportInput = document.getElementById('fileImportInput');
    document.getElementById('btnImport').addEventListener('click', () => fileImportInput.click());
    fileImportInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            links = imported;
            renderLinks();
            await syncToCloud();
            showToast('Data dipulihkan 🎉');
          }
        } catch (err) {
          alert('Format JSON keliru.');
        }
      };
      reader.readAsText(file);
    });

    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.innerText = msg;
      toastIcon.innerText = icon;
      toast.classList.remove('opacity-0', 'translate-y-16');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-16');
      }, 2000);
    }

    // Eksekusi Awal
    initTheme();
    setViewMode(currentView);
    links = loadLocalLinks();
    renderLinks();
  </script>
</body>
</html>
