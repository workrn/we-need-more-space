<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Need More Space 🪐 | Personal Link Vault</title>
  
  <!-- Font Quicksand & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Quicksand"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root[data-theme="linen"] {
      --bg-main: #fbf9f5;
      --bg-card: #fdfcf9;
      --bg-subtle: #f3efe6;
      --border-subtle: #e6dfd3;
      --text-main: #2d3137;
      --text-muted: #6b7280;
      --accent: #5e7153;
      --accent-subtle: #edf3e8;
      --accent-text: #374630;
      --badge-bg: #efece4;
    }

    :root[data-theme="sage"] {
      --bg-main: #f4f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #e5ece5;
      --border-subtle: #d2ddd2;
      --text-main: #273428;
      --text-muted: #5e6f60;
      --accent: #48694c;
      --accent-subtle: #e3ede3;
      --accent-text: #2c442e;
      --badge-bg: #e6eee6;
    }

    :root[data-theme="lavender"] {
      --bg-main: #f7f6f9;
      --bg-card: #ffffff;
      --bg-subtle: #ece8f2;
      --border-subtle: #ded8e8;
      --text-main: #2e2a36;
      --text-muted: #6b6377;
      --accent: #6c5a8a;
      --accent-subtle: #f0ebf8;
      --accent-text: #483961;
      --badge-bg: #eeeaf5;
    }

    :root[data-theme="latte"] {
      --bg-main: #f9f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #ede6dc;
      --border-subtle: #dfd4c5;
      --text-main: #383028;
      --text-muted: #74685a;
      --accent: #7c6246;
      --accent-subtle: #f5ece2;
      --accent-text: #4f3d29;
      --badge-bg: #efe9e0;
    }

    :root[data-theme="dark"] {
      --bg-main: #181b1e;
      --bg-card: #22262b;
      --bg-subtle: #2d333b;
      --border-subtle: #3a414b;
      --text-main: #e8ecf1;
      --text-muted: #9aa2ad;
      --accent: #86a77d;
      --accent-subtle: #273525;
      --accent-text: #c0dbc4;
      --badge-bg: #2d333a;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-subtle);
    }

    .theme-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-subtle);
    }

    .theme-accent-btn {
      background-color: var(--accent);
      color: #ffffff;
    }
    .theme-accent-btn:hover {
      filter: brightness(0.92);
    }

    .theme-badge {
      background-color: var(--badge-bg);
      color: var(--text-muted);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-opacity-90 border-b theme-card">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-15 flex items-center justify-between gap-3">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-lg shadow-xs border border-stone-200/50" style="background-color: var(--accent-subtle);">
          🪐
        </div>
        <div>
          <h1 class="font-display font-bold text-base sm:text-lg tracking-tight leading-tight flex items-center gap-1.5">
            We Need More Space
          </h1>
          <p class="text-[10px] sm:text-[11px] text-stone-500 font-sans leading-none">cozy corner for your links 🍃</p>
        </div>
      </div>

      <!-- Controls: Theme, View Switcher & Auth -->
      <div class="flex items-center gap-2">
        
        <!-- Theme Dropdown -->
        <div class="relative">
          <select id="themeSelector" class="text-xs font-medium rounded-xl px-2.5 py-1.5 border appearance-none pr-7 cursor-pointer theme-subtle focus:outline-none">
            <option value="linen">🌾 Linen</option>
            <option value="sage">🍃 Sage</option>
            <option value="lavender">🌸 Lavender</option>
            <option value="latte">☕ Latte</option>
            <option value="dark">🌌 Midnight</option>
          </select>
          <i data-lucide="palette" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-60"></i>
        </div>

        <!-- Auth UI -->
        <div id="authContainer" class="flex items-center">
          <button id="btnLogin" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-xl border border-stone-300 shadow-xs hover:bg-stone-50 transition-colors bg-white text-stone-800">
