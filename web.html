<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Need More Space 🪐 | Personal Link Vault</title>
  
  <!-- Font Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Quicksand"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Theme Palettes - Muted & Low Eye Strain */
    :root[data-theme="linen"] {
      --bg-main: #fbf9f5;
      --bg-card: #fdfcf9;
      --bg-subtle: #f3efe6;
      --border-subtle: #e6dfd3;
      --text-main: #2d3137;
      --text-muted: #6b7280;
      --accent: #5e7153;
      --accent-subtle: #edf3e8;
      --accent-text: #374630;
      --badge-bg: #efece4;
    }

    :root[data-theme="sage"] {
      --bg-main: #f4f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #e5ece5;
      --border-subtle: #d2ddd2;
      --text-main: #273428;
      --text-muted: #5e6f60;
      --accent: #48694c;
      --accent-subtle: #e3ede3;
      --accent-text: #2c442e;
      --badge-bg: #e6eee6;
    }

    :root[data-theme="lavender"] {
      --bg-main: #f7f6f9;
      --bg-card: #ffffff;
      --bg-subtle: #ece8f2;
      --border-subtle: #ded8e8;
      --text-main: #2e2a36;
      --text-muted: #6b6377;
      --accent: #6c5a8a;
      --accent-subtle: #f0ebf8;
      --accent-text: #483961;
      --badge-bg: #eeeaf5;
    }

    :root[data-theme="latte"] {
      --bg-main: #f9f7f4;
      --bg-card: #ffffff;
      --bg-subtle: #ede6dc;
      --border-subtle: #dfd4c5;
      --text-main: #383028;
      --text-muted: #74685a;
      --accent: #7c6246;
      --accent-subtle: #f5ece2;
      --accent-text: #4f3d29;
      --badge-bg: #efe9e0;
    }

    :root[data-theme="dark"] {
      --bg-main: #181b1e;
      --bg-card: #22262b;
      --bg-subtle: #2d333b;
      --border-subtle: #3a414b;
      --text-main: #e8ecf1;
      --text-muted: #9aa2ad;
      --accent: #86a77d;
      --accent-subtle: #273525;
      --accent-text: #c0dbc4;
      --badge-bg: #2d333a;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-subtle);
    }

    .theme-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-subtle);
    }

    .theme-accent-btn {
      background-color: var(--accent);
      color: #ffffff;
    }
    .theme-accent-btn:hover {
      filter: brightness(0.92);
    }

    .theme-badge {
      background-color: var(--badge-bg);
      color: var(--text-muted);
    }

    /* Scrollbar halus */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Top Navigation & Profile Bar -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-opacity-85 border-b theme-card">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-xl shadow-sm border border-stone-200/50" style="background-color: var(--accent-subtle);">
          🪐
        </div>
        <div>
          <h1 class="font-display font-bold text-lg sm:text-xl tracking-tight leading-tight flex items-center gap-1.5">
            We Need More Space
            <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background-color: var(--badge-bg); color: var(--text-muted);">v2.0</span>
          </h1>
          <p class="text-[11px] sm:text-xs text-stone-500 tracking-wide font-sans">safe corner for your bookmarks & ideas 🍃</p>
        </div>
      </div>

      <!-- Controls: Theme & Auth -->
      <div class="flex items-center gap-2 sm:gap-3">
        
        <!-- Theme Dropdown -->
        <div class="relative">
          <select id="themeSelector" class="text-xs font-medium rounded-xl px-2.5 py-1.5 border appearance-none pr-7 cursor-pointer theme-subtle focus:outline-none focus:ring-1 focus:ring-stone-400">
            <option value="linen">🌾 Warm Linen</option>
            <option value="sage">🍃 Misty Sage</option>
            <option value="lavender">🌸 Soft Lavender</option>
            <option value="latte">☕ Cozy Latte</option>
            <option value="dark">🌌 Midnight Slate</option>
          </select>
          <i data-lucide="palette" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-60"></i>
        </div>

        <!-- Firebase Auth UI Container -->
        <div id="authContainer" class="flex items-center">
          <button id="btnLogin" class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-xl border border-stone-300/80 shadow-xs hover:bg-stone-100 transition-colors bg-white text-stone-800">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span class="hidden sm:inline">Masuk</span>
          </button>

          <!-- Logged In State (Hidden by default) -->
          <div id="userProfile" class="hidden items-center gap-2">
            <img id="userAvatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-stone-200 object-cover">
            <button id="btnLogout" title="Keluar Akun" class="p-1.5 rounded-xl border theme-subtle hover:bg-red-50 hover:text-red-600 transition-colors">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- Sync Alert / Status -->
    <div id="syncBanner" class="p-3.5 rounded-2xl border text-xs sm:text-sm flex items-center justify-between gap-3 theme-card shadow-xs">
      <div class="flex items-center gap-2.5">
        <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <span id="syncText" class="font-medium text-stone-600 dark:text-stone-300">Mode Penyimpanan: Browser Lokal (Belum Login)</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnExport" class="text-xs px-2.5 py-1 rounded-lg border theme-subtle hover:opacity-80 transition-opacity">Backup JSON</button>
        <button id="btnImport" class="text-xs px-2.5 py-1 rounded-lg border theme-subtle hover:opacity-80 transition-opacity">Restore</button>
        <input type="file" id="fileImportInput" accept=".json" class="hidden">
      </div>
    </div>

    <!-- Action Bar: Add Link Button + Search & Filters -->
    <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
      
      <!-- Search Input -->
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400"></i>
        <input type="text" id="searchInput" placeholder="Cari judul, tag, atau isi tautan..." class="w-full text-xs sm:text-sm pl-10 pr-4 py-2.5 rounded-2xl border theme-card focus:outline-none focus:ring-1 focus:ring-stone-400">
      </div>

      <!-- Action Tools -->
      <div class="flex items-center gap-2">
        <!-- Filter Category -->
        <select id="categoryFilter" class="text-xs sm:text-sm py-2.5 px-3 rounded-2xl border theme-card focus:outline-none cursor-pointer">
          <option value="ALL">Semua Kategori 📂</option>
          <option value="Kerja">💼 Kerja / Kantor</option>
          <option value="Belajar">📚 Kuliah & Riset</option>
          <option value="Bacaan">📖 Bacaan Santai</option>
          <option value="Belanja">🛍️ Wishlist & Belanja</option>
          <option value="Inspirasi">✨ Ide & Inspirasi</option>
          <option value="Lainnya">📎 Catatan Acak</option>
        </select>

        <!-- Toggle Favorites -->
        <button id="filterFavBtn" class="flex items-center gap-1.5 px-3 py-2.5 text-xs sm:text-sm rounded-2xl border theme-card hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
          <i data-lucide="star" class="w-4 h-4 text-amber-500"></i>
          <span class="hidden sm:inline">Favorit</span>
        </button>

        <!-- Add Link Button -->
        <button id="btnOpenModal" class="flex items-center gap-1.5 text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-2xl shadow-xs theme-accent-btn transition-transform active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Simpan Link</span>
        </button>
      </div>

    </div>

    <!-- Empty State Container -->
    <div id="emptyState" class="hidden text-center py-16 px-4">
      <div class="w-16 h-16 mx-auto mb-3 rounded-3xl flex items-center justify-center text-3xl theme-subtle">
        📭
      </div>
      <h3 class="font-display font-bold text-base text-stone-700 dark:text-stone-200">Belum ada link di ruang ini</h3>
      <p class="text-xs text-stone-500 mt-1 max-w-xs mx-auto">Klik tombol <strong>"Simpan Link"</strong> untuk menaruh bookmark favoritmu!</p>
    </div>

    <!-- Links Grid -->
    <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Cards will be populated here via JS -->
    </div>

  </main>

  <!-- Modal: Tambah / Edit Link -->
  <div id="linkModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="w-full max-w-md rounded-3xl p-6 theme-card border shadow-xl relative animate-in fade-in zoom-in-95 duration-150">
      
      <div class="flex items-center justify-between pb-3 border-b border-stone-200/60 dark:border-stone-700">
        <h3 id="modalTitle" class="font-display font-bold text-base flex items-center gap-2">
          <span>✨</span> Simpan Link Baru
        </h3>
        <button id="btnCloseModal" class="p-1.5 rounded-full hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="linkForm" class="mt-4 space-y-3.5 text-xs sm:text-sm">
        <input type="hidden" id="editLinkId">

        <div>
          <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">URL / Tautan Website <span class="text-red-500">*</span></label>
          <input type="url" id="inputUrl" required placeholder="https://example.com" class="w-full px-3.5 py-2 rounded-xl border theme-subtle focus:outline-none focus:ring-1 focus:ring-stone-400">
        </div>

        <div>
          <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Judul / Nama <span class="text-red-500">*</span></label>
          <input type="text" id="inputTitle" required placeholder="Contoh: Dokumen Kerja atau Catatan Resep" class="w-full px-3.5 py-2 rounded-xl border theme-subtle focus:outline-none focus:ring-1 focus:ring-stone-400">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Kategori</label>
            <select id="inputCategory" class="w-full px-3 py-2 rounded-xl border theme-subtle focus:outline-none cursor-pointer">
              <option value="Kerja">💼 Kerja</option>
              <option value="Belajar">📚 Belajar</option>
              <option value="Bacaan">📖 Bacaan</option>
              <option value="Belanja">🛍️ Belanja</option>
              <option value="Inspirasi">✨ Inspirasi</option>
              <option value="Lainnya">📎 Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Tandai Favorit?</label>
            <div class="flex items-center h-9">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="inputFavorite" class="w-4 h-4 rounded text-amber-500 focus:ring-amber-400">
                <span class="text-xs">Bintang ⭐</span>
              </label>
            </div>
          </div>
        </div>

        <div>
          <label class="block font-medium mb-1 text-stone-600 dark:text-stone-300">Catatan Singkat (Opsional)</label>
          <textarea id="inputNotes" rows="2" placeholder="Catatan kecil kenapa link ini disimpan..." class="w-full px-3.5 py-2 rounded-xl border theme-subtle focus:outline-none focus:ring-1 focus:ring-stone-400 resize-none"></textarea>
        </div>

        <div class="pt-3 flex gap-2">
          <button type="button" id="btnCancelModal" class="flex-1 py-2.5 rounded-xl border theme-subtle font-medium">Batal</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl font-medium shadow-xs theme-accent-btn">Simpan ke Vault</button>
        </div>
      </form>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-200 pointer-events-none px-4 py-2.5 rounded-2xl theme-card border shadow-lg text-xs font-semibold flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Berhasil!</span>
  </div>

  <!-- Firebase Modular Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Kunci Konfigurasi Firebase Proyek we-need-space Anda
    const firebaseConfig = {
      apiKey: "AIzaSyCDXzDZAijlJ47lxU1hYgYU-x_Bhsd5Bbg",
      authDomain: "we-need-space.firebaseapp.com",
      projectId: "we-need-space",
      storageBucket: "we-need-space.firebasestorage.app",
      messagingSenderId: "645398768628",
      appId: "1:645398768628:web:080b1dc382411f8ca2a7a1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // App State
    let currentUser = null;
    let links = [];
    let filterCategory = 'ALL';
    let filterFavoriteOnly = false;
    let searchQuery = '';

    // Elements
    const linksGrid = document.getElementById('linksGrid');
    const emptyState = document.getElementById('emptyState');
    const themeSelector = document.getElementById('themeSelector');
    const linkModal = document.getElementById('linkModal');
    const linkForm = document.getElementById('linkForm');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const filterFavBtn = document.getElementById('filterFavBtn');
    const syncDot = document.getElementById('syncDot');
    const syncText = document.getElementById('syncText');
    const btnLogin = document.getElementById('btnLogin');
    const btnLogout = document.getElementById('btnLogout');
    const userProfile = document.getElementById('userProfile');
    const userAvatar = document.getElementById('userAvatar');

    // Category Badges & Emojis
    const categoryConfig = {
      Kerja: { emoji: '💼', label: 'Kerja' },
      Belajar: { emoji: '📚', label: 'Belajar' },
      Bacaan: { emoji: '📖', label: 'Bacaan' },
      Belanja: { emoji: '🛍️', label: 'Belanja' },
      Inspirasi: { emoji: '✨', label: 'Inspirasi' },
      Lainnya: { emoji: '📎', label: 'Lainnya' }
    };

    // 1. Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('wnms_theme') || 'linen';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeSelector.value = savedTheme;
    }

    themeSelector.addEventListener('change', (e) => {
      const chosen = e.target.value;
      document.documentElement.setAttribute('data-theme', chosen);
      localStorage.setItem('wnms_theme', chosen);
    });

    // 2. Data Persistence (Local & Firestore)
    function loadLocalLinks() {
      try {
        return JSON.parse(localStorage.getItem('wnms_links') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLocalLinks(data) {
      localStorage.setItem('wnms_links', JSON.stringify(data));
    }

    async function syncToCloud() {
      if (!currentUser) {
        saveLocalLinks(links);
        return;
      }
      try {
        const docRef = doc(db, 'users', currentUser.uid);
        await setDoc(docRef, { links: links, updatedAt: new Date().toISOString() }, { merge: true });
        showToast('Tersimpan di Cloud ☁️');
      } catch (err) {
        console.error('Gagal sinkron cloud:', err);
        showToast('Gagal simpan ke cloud, dicadangkan ke lokal ⚠️');
        saveLocalLinks(links);
      }
    }

    async function fetchFromCloud(uid) {
      try {
        const docRef = doc(db, 'users', uid);
        const snap = await getDoc(docRef);
        if (snap.exists() && snap.data().links) {
          links = snap.data().links;
        } else {
          // Jika di cloud masih kosong, cadangkan data lokal ke cloud
          const local = loadLocalLinks();
          if (local.length > 0) {
            links = local;
            await syncToCloud();
          }
        }
        renderLinks();
      } catch (err) {
        console.error('Fetch error:', err);
        links = loadLocalLinks();
        renderLinks();
      }
    }

    // 3. Auth Handlers
    btnLogin.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        alert('Gagal login Google: ' + e.message);
      }
    });

    btnLogout.addEventListener('click', async () => {
      await signOut(auth);
      showToast('Berhasil keluar akun');
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        btnLogin.classList.add('hidden');
        userProfile.classList.remove('hidden');
        userAvatar.src = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;
        
        syncDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
        syncText.innerText = `Terhubung ke Cloud (${user.displayName || user.email})`;
        
        await fetchFromCloud(user.uid);
      } else {
        currentUser = null;
        btnLogin.classList.remove('hidden');
        userProfile.classList.add('hidden');
        
        syncDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
        syncText.innerText = 'Mode Penyimpanan: Browser Lokal (Belum Login)';
        
        links = loadLocalLinks();
        renderLinks();
      }
    });

    // 4. Render Engine
    function renderLinks() {
      linksGrid.innerHTML = '';
      
      const filtered = links.filter(item => {
        const matchesCategory = (filterCategory === 'ALL' || item.category === filterCategory);
        const matchesFavorite = (!filterFavoriteOnly || item.favorite);
        const query = searchQuery.toLowerCase();
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              item.url.toLowerCase().includes(query) || 
                              (item.notes && item.notes.toLowerCase().includes(query));
        return matchesCategory && matchesFavorite && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        
        filtered.forEach(item => {
          let hostname = '';
          try {
            hostname = new URL(item.url).hostname;
          } catch(e) {
            hostname = item.url;
          }

          const card = document.createElement('div');
          card.className = 'theme-card border rounded-3xl p-4 sm:p-5 flex flex-col justify-between hover:shadow-md transition-all duration-200 group relative';

          card.innerHTML = `
            <div>
              <div class="flex items-start justify-between gap-3 mb-2.5">
                <div class="flex items-center gap-2.5 min-w-0">
                  <img src="https://www.google.com/s2/favicons?domain=${hostname}&sz=32" 
                       onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22currentColor%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/></svg>'" 
                       class="w-6 h-6 rounded-lg p-0.5 border border-stone-200/80 bg-white object-contain flex-shrink-0" alt="Favicon">
                  <h4 class="font-display font-bold text-sm sm:text-base leading-snug truncate">${escapeHtml(item.title)}</h4>
                </div>
                <button class="toggle-fav-btn p-1 text-stone-400 hover:text-amber-500 transition-colors" data-id="${item.id}">
                  <i data-lucide="star" class="w-4 h-4 ${item.favorite ? 'fill-amber-400 text-amber-500' : ''}"></i>
                </button>
              </div>

              ${item.notes ? `<p class="text-xs text-stone-500 dark:text-stone-400 line-clamp-2 mb-3 font-normal">${escapeHtml(item.notes)}</p>` : ''}
              
              <div class="flex items-center gap-2 mb-4">
                <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full theme-badge flex items-center gap-1">
                  ${categoryConfig[item.category]?.emoji || '📎'} ${item.category}
                </span>
                <span class="text-[11px] text-stone-400 truncate max-w-[140px]">${hostname}</span>
              </div>
            </div>

            <div class="pt-3 border-t border-stone-100 dark:border-stone-800 flex items-center justify-between text-xs">
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-semibold text-xs flex items-center gap-1 hover:underline" style="color: var(--accent);">
                Buka Link <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>

              <div class="flex items-center gap-1 opacity-90 group-hover:opacity-100">
                <button class="copy-btn p-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500" data-url="${item.url}" title="Salin URL">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                </button>
                <button class="edit-btn p-1.5 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-500" data-id="${item.id}" title="Edit Link">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                </button>
                <button class="delete-btn p-1.5 rounded-lg hover:bg-red-50 hover:text-red-600 text-stone-400 transition-colors" data-id="${item.id}" title="Hapus">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          `;

          linksGrid.appendChild(card);
        });
      }

      lucide.createIcons();
      attachCardListeners();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 5. Modal Operations
    const btnOpenModal = document.getElementById('btnOpenModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnCancelModal = document.getElementById('btnCancelModal');
    const modalTitle = document.getElementById('modalTitle');
    const editLinkId = document.getElementById('editLinkId');

    function openModal(editItem = null) {
      if (editItem) {
        modalTitle.innerHTML = '<span>✏️</span> Edit Tautan';
        editLinkId.value = editItem.id;
        document.getElementById('inputUrl').value = editItem.url;
        document.getElementById('inputTitle').value = editItem.title;
        document.getElementById('inputCategory').value = editItem.category || 'Lainnya';
        document.getElementById('inputFavorite').checked = !!editItem.favorite;
        document.getElementById('inputNotes').value = editItem.notes || '';
      } else {
        modalTitle.innerHTML = '<span>✨</span> Simpan Link Baru';
        editLinkId.value = '';
        linkForm.reset();
      }
      linkModal.classList.remove('hidden');
      linkModal.classList.add('flex');
    }

    function closeModal() {
      linkModal.classList.add('hidden');
      linkModal.classList.remove('flex');
      linkForm.reset();
    }

    btnOpenModal.addEventListener('click', () => openModal());
    btnCloseModal.addEventListener('click', closeModal);
    btnCancelModal.addEventListener('click', closeModal);

    linkForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = editLinkId.value;
      const url = document.getElementById('inputUrl').value.trim();
      const title = document.getElementById('inputTitle').value.trim();
      const category = document.getElementById('inputCategory').value;
      const favorite = document.getElementById('inputFavorite').checked;
      const notes = document.getElementById('inputNotes').value.trim();

      if (id) {
        // Edit existing
        const index = links.findIndex(l => l.id === id);
        if (index !== -1) {
          links[index] = { ...links[index], url, title, category, favorite, notes, updatedAt: Date.now() };
          showToast('Tautan diperbarui! ✏️');
        }
      } else {
        // New item
        const newItem = {
          id: 'link_' + Date.now(),
          url,
          title,
          category,
          favorite,
          notes,
          createdAt: Date.now()
        };
        links.unshift(newItem);
        showToast('Link baru tersimpan! 🪐');
      }

      closeModal();
      renderLinks();
      await syncToCloud();
    });

    // 6. Action Buttons Inside Cards
    function attachCardListeners() {
      // Copy URL
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const url = btn.getAttribute('data-url');
          if (navigator.clipboard) {
            navigator.clipboard.writeText(url).then(() => showToast('Tautan disalin ke clipboard! 📋'));
          } else {
            const ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('Tautan disalin! 📋');
          }
        });
      });

      // Toggle Fav
      document.querySelectorAll('.toggle-fav-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const target = links.find(l => l.id === id);
          if (target) {
            target.favorite = !target.favorite;
            renderLinks();
            await syncToCloud();
          }
        });
      });

      // Edit
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const target = links.find(l => l.id === id);
          if (target) openModal(target);
        });
      });

      // Delete
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (confirm('Yakin ingin menghapus bookmark tautan ini?')) {
            links = links.filter(l => l.id !== id);
            renderLinks();
            await syncToCloud();
            showToast('Tautan dihapus 🗑️');
          }
        });
      });
    }

    // 7. Search & Filters
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderLinks();
    });

    categoryFilter.addEventListener('change', (e) => {
      filterCategory = e.target.value;
      renderLinks();
    });

    filterFavBtn.addEventListener('click', () => {
      filterFavoriteOnly = !filterFavoriteOnly;
      if (filterFavoriteOnly) {
        filterFavBtn.classList.add('bg-amber-100', 'border-amber-300', 'dark:bg-amber-950/40');
      } else {
        filterFavBtn.classList.remove('bg-amber-100', 'border-amber-300', 'dark:bg-amber-950/40');
      }
      renderLinks();
    });

    // 8. JSON Export / Import
    document.getElementById('btnExport').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(links, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `we-need-more-space-backup-${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('Cadangan berhasil diunduh! 📦');
    });

    const fileImportInput = document.getElementById('fileImportInput');
    document.getElementById('btnImport').addEventListener('click', () => fileImportInput.click());
    fileImportInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            links = imported;
            renderLinks();
            await syncToCloud();
            showToast('Data berhasil dipulihkan! 🎉');
          } else {
            alert('Format file JSON tidak sesuai.');
          }
        } catch (err) {
          alert('Gagal membaca file JSON.');
        }
      };
      reader.readAsText(file);
    });

    // 9. Toast Notification Helper
    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      
      toastMsg.innerText = msg;
      toastIcon.innerText = icon;
      toast.classList.remove('opacity-0', 'translate-y-20');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-20');
      }, 2500);
    }

    // Initial Executions
    initTheme();
    links = loadLocalLinks();
    renderLinks();
  </script>
</body>
</html>
